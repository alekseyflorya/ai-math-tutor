name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs that publish or deploy ask for more explicitly.
# Actions are pinned to commit SHAs (the deploy job hands them an SSH key).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: tutor
          POSTGRES_DB: tutor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tutor" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tutor/shared build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Tests (math engine unit tests + API e2e on Postgres with the mock LLM)
        run: pnpm test
        env:
          DATABASE_URL_TEST: postgres://tutor:tutor@localhost:5432/tutor_test
      - run: pnpm --filter @tutor/web build

  images:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-math-tutor-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/ai-math-tutor-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      HAS_SSH: ${{ secrets.SSH_HOST != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_SSH == 'true'
      - name: Copy compose file
        if: env.HAS_SSH == 'true'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: deploy/docker-compose.prod.yml
          target: /opt/ai-math-tutor
          strip_components: 1
      - name: Pull and restart
        if: env.HAS_SSH == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/ai-math-tutor
            dc() { docker compose -f docker-compose.prod.yml "$@"; }
            healthy() {
              for i in $(seq 1 30); do
                if dc exec -T api node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }
            # The tag running now, read before pulling: the rollback target. Empty on the first deploy.
            PREV=$(docker inspect --format '{{.Config.Image}}' "$(dc ps -q api)" 2>/dev/null | cut -d: -f2 || true)
            # The job token can read this repo's packages, so images may stay private.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export IMAGE_TAG=${{ github.sha }}
            dc pull
            dc up -d --remove-orphans
            if healthy; then
              echo "API healthy on $IMAGE_TAG"
              docker logout ghcr.io
              docker image prune -f # only now: the previous image stays until the new one is proven
              exit 0
            fi
            dc logs --tail=80 api
            if [ -z "$PREV" ]; then
              echo "::error::Deploy of $IMAGE_TAG is unhealthy and there is no previous version to roll back to"
              docker logout ghcr.io
              exit 1
            fi
            echo "::error::Deploy of $IMAGE_TAG is unhealthy; rolling back to $PREV"
            export IMAGE_TAG=$PREV
            dc pull
            dc up -d --remove-orphans
            if healthy; then
              echo "Rolled back to $PREV; it is healthy"
            else
              echo "::error::The rollback to $PREV is unhealthy too"
              dc logs --tail=80 api
            fi
            docker logout ghcr.io
            exit 1 # a rollback is still a failed deploy
      - name: Skipped
        if: env.HAS_SSH != 'true'
        run: echo "SSH secrets are not configured yet; images are pushed, deploy skipped."
