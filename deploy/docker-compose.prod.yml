# Production on a small VPS (2 vCPU / 2 GB). Images are built by GitHub Actions and
# pulled from GHCR; nothing is compiled on the server. Lives in /opt/ai-math-tutor
# next to a .env file (see .env.example). Deployed by .github/workflows/ci.yml.
name: ai-math-tutor

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Sized for ~1.6 GB of usable RAM shared with the API and Caddy.
    command:
      ['postgres', '-c', 'shared_buffers=128MB', '-c', 'max_connections=30', '-c', 'work_mem=4MB']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 384m
    logging: *logging
    # No published ports: Postgres is reachable only from the internal network.

  api:
    image: ghcr.io/alekseyflorya/ai-math-tutor-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      COOKIE_SECURE: 'true'
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 448m
    logging: *logging

  web:
    image: ghcr.io/alekseyflorya/ai-math-tutor-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - caddy_data:/data # certificates — must survive redeploys
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: 128m
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
